[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archon"
version = "0.1.0"
description = "Autonomous Lean 4 formalization system"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "pydantic",
]

[project.optional-dependencies]
# Required only when running OpenAI / Gemini multilane lanes through
# the bundled Anthropic-API proxy (`archon.proxy.server`). Heavy enough
# that a default install stays slim without them.
proxy = [
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "litellm>=1.77",
    "python-dotenv>=1.0",
]

[project.scripts]
archon = "archon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archon*"]

[tool.setuptools.package-data]
"archon" = [".archon-src/**/*",
            ".archon-src/**/.*",
            "ui/**/*"]