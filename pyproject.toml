[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archon"
version = "0.1.0"
description = "Autonomous Lean 4 formalization system"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "pydantic",
    # Used by the bundled Anthropic↔LiteLLM proxy (archon.proxy.server)
    # for OpenAI / Gemini multilane lanes. Could be optional, but a
    # single `pip install archon` covering every multilane provider is
    # less footgun than `archon[proxy]`.
    "fastapi[standard]>=0.115",
    "uvicorn>=0.34",
    "litellm>=1.77",
    "python-dotenv>=1.0",
]

[project.scripts]
archon = "archon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archon*"]

[tool.setuptools.package-data]
"archon" = [".archon-src/**/*",
            ".archon-src/**/.*",
            "ui/**/*"]